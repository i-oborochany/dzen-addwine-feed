# Зарубежные топовые источники (рерайт с переводом)
sources_en:
  - name: "Decanter"
    type: "rss"
    url: "https://www.decanter.com/feed"
  - name: "Wine Spectator"
    type: "rss"
    url: "https://www.winespectator.com/rss/news"
  - name: "Wine Enthusiast"
    type: "rss"
    url: "https://www.wineenthusiast.com/feed/"
  - name: "VinePair"
    type: "rss"
    url: "https://vinepair.com/feed/"
  - name: "The Drinks Business"
    type: "rss"
    url: "https://www.thedrinksbusiness.com/feed/"
  - name: "Wine-Searcher"
    type: "rss"
    url: "https://www.wine-searcher.com/feeds/news.xml"

# Ключевые слова для фильтра «винной» тематики
wine_keywords:
  - "вино"
  - "винодел"
  - "виноград"
  - "бокал"
  - "сомелье"
  - "ресторан"
  - "винный"
  - "шампанск"
  - "игристое"
  - "терруар"
  - "ассамбляж"
  - "купаж"
  - "wine"
  - "winery"
  - "sommelier"
  - "vineyard"
  - "vintage"
  - "champagne"

# Сколько кандидатов передаём в GigaChat для выбора финальной темы
candidate_pool_size: 20

# Окно «свежести» (дни) — статьи старше отбрасываются (кроме evergreen-режима)
freshness_window_days: 30

# Доля evergreen-постов (когда нет горячих новостей)
evergreen_ratio: 0.1
