# Настройки бота публикаций для канала Дзен addwine

channel:
  title: "Addwine — о вине"
  link: "https://dzen.ru/addwine"
  description: "Новости и материалы о вине, виноделии и винной культуре"
  language: "ru"
  pages_base_url: "https://i-oborochany.github.io/dzen-addwine-feed"

publishing:
  # Целевая длина статьи (символы)
  target_length: 2500
  min_length: 1800
  max_length: 3500
  # Дисклеймер 18+ в конце статьи (для алкогольной тематики)
  add_disclaimer: true
  disclaimer_text: "Материал предназначен для лиц старше 18 лет. Чрезмерное употребление алкоголя вредит вашему здоровью."

# Цвета для обложек (Pantone)
brand_colors:
  primary_pantone: "302"
  primary_hex: "#003E6B"
  accent_pantone: "7403"
  accent_hex: "#EFD79A"

# Стилистика обложек (вшиваем в Kandinsky-промпт)
image_style: |
  Стиль: классический но не древний, с новыми технологиями и аксессуарами,
  приятные люди, красивый и богатый интерьер. Бокалы с тонкой ножкой,
  большого объёма. Фигура человека (рабочая область, не обязательно целиком),
  сценарий «за столом, дома или в ресторане». Тёплый кремовый и тёмно-синий
  как акценты. Лёгкий неброский текст, не закрывающий основную область.

