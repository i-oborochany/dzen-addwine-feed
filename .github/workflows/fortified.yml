name: Вермуты и креплёные вина

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Форсировать публикацию"
        type: boolean
        default: false
  # ОТКЛЮЧЕНО с 14.08.2026: рубрика уводит поддомен из винного тематического ядра.
  # Оставлен только ручной запуск через workflow_dispatch.
  # schedule:
  #   - cron: "0 14 4,8,12,16,20,24,28 * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RUBRIC: "fortified"
          FORCE_PUBLISH: ${{ inputs.force && '1' || '' }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/main_extras.py
      - name: Commit and push
        run: |
          git config user.name "fortified-bot"
          git config user.email "fortified-bot@local"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Fortified post $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Ping IndexNow after deploy
        if: success()
        run: |
          pip install requests -q
          python scripts/ping_recent.py || echo "ping не критичен"
