name: Daily Wine Post

on:
  schedule:
    # НОВЫЙ ТЕМП (14.08.2026): Пн/Ср/Пт по одному разу — цель ≤ 4-5 статей/нед всего по всем рубрикам.
    # 11:17 МСК (08:17 UTC) — не на верхушке часа. Дедуп + already_published_today защищают от дублей.
    - cron: "17 8 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/main.py

      - name: Commit and push
        run: |
          git config user.name "addwine-bot"
          git config user.email "bot@addwine.local"
          git add feed.xml images/ posts/ index.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Daily post $(date -u +%Y-%m-%d)"
            git push
          fi
