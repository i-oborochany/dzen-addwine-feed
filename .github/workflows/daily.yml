name: Verify DZEN image generation

on:
  push:
    tags:
      - "dzen-image-check-20261031-fe90079"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout migrated image client
        uses: actions/checkout@v4
        with:
          ref: fe900792f679ffa2f4a5a8069c115796ee7e7e30
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image client dependencies
        run: pip install requests Pillow
      - name: Generate and verify one JPEG
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'CHECK'
          import sys, io, json, hashlib, pathlib, os
          sys.path.insert(0, 'scripts')
          import openai_api
          from PIL import Image
          prompt = 'Editorial still life for a wine magazine: one empty wine glass beside a closed bottle on a wooden table, soft natural window light, realistic photography, no people, no letters or logos.'
          raw = openai_api.generate_image(prompt, retries=0)
          picture = Image.open(io.BytesIO(raw))
          assert picture.format == 'JPEG', picture.format
          assert picture.size == (1536, 1024), picture.size
          picture.verify()
          pathlib.Path('cover-verification.jpg').write_bytes(raw)
          receipt = {'model': openai_api.MODEL, 'quality': openai_api.QUALITY, 'size': openai_api.SIZE, 'format': 'JPEG', 'byte_count': len(raw), 'sha256': hashlib.sha256(raw).hexdigest(), 'verified': True, 'article_published': False}
          pathlib.Path('image-verification.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Image generation verified: ' + json.dumps(receipt) + '\n')
          CHECK
      - name: Save verification image and receipt
        uses: actions/upload-artifact@v4
        with:
          name: dzen-flare-verification
          path: |
            cover-verification.jpg
            image-verification.json
          retention-days: 3
