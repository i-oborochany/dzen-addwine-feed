name: DZEN pipeline audit
'on':
  push:
    tags:
    - dzen-pipeline-audit-20261031-f6e5f9d
permissions:
  contents: read
concurrency:
  group: dzen-content-main
  queue: max
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
    - name: Checkout audited production code
      uses: actions/checkout@v4
      with:
        ref: f6e5f9d6968d56245b8758f957fd9b0ea3bb9844
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install production dependencies
      run: pip install -r requirements.txt
    - name: Run all publication and client tests
      run: python -B -m unittest discover -s tests -v
    - name: Live text components and publication readback
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        PYTHONUNBUFFERED: '1'
        PYTHONDONTWRITEBYTECODE: '1'
      run: |
        python -B - <<'AUDIT'
        import sys, json, hashlib, io, copy
        from pathlib import Path
        from datetime import datetime, timezone, timedelta
        from zoneinfo import ZoneInfo
        from email.utils import parsedate_to_datetime
        import requests
        from PIL import Image
        sys.path.insert(0, 'scripts')
        import claude_api, openai_api, seo_planner, addwine_linker, progress, weekly_digest, stop_list, feed_io
        state = progress.load_progress()
        plan = progress.load_content_plan()
        selected, row = progress.select_content_plan(plan, state['content_plan_index'], stop_list.should_skip_topic)
        assert state['cycle_position'] == 3
        before = (Path('posts/progress.json').read_bytes(), Path('feed_full.json').read_bytes())
        seed_result = claude_api.generate_json(seo_planner.SEED_SYSTEM, 'TOPIC: reading wine labels. Return search phrases in Russian.', max_tokens=500, temperature=0.3)
        assert seed_result.get('phrases') and all(isinstance(x, str) and x for x in seed_result['phrases'])
        links = addwine_linker.fetch_links()
        assert links
        candidate = next((x for x in links if '\u0431\u043e\u043a\u0430\u043b' in x['title'].lower()), links[0])
        raw_calls = []
        original = claude_api.generate_json
        def capture(*args, **kwargs):
            result = original(*args, **kwargs)
            raw_calls.append(result)
            return result
        claude_api.generate_json = capture
        try:
            linked = addwine_linker.inject_link('<p>Wine glasses help reveal the aroma of wine.</p>', [candidate])
        finally:
            claude_api.generate_json = original
        assert raw_calls and {'html', 'link_inserted', 'selected_url', 'selected_title'} <= set(raw_calls[0])
        assert isinstance(linked['html'], str) and isinstance(linked['link_inserted'], bool)
        feed_data = feed_io.read_feed()
        article = feed_data['items'][0]
        headers = {'User-Agent': 'DZEN-Pipeline-Audit/1.0'}
        page = requests.get(article['link'], headers=headers, timeout=(10, 30))
        page.raise_for_status()
        assert article['title'] in page.text
        cover = requests.get(article['enclosure_url'], headers=headers, timeout=(10, 30))
        cover.raise_for_status()
        picture = Image.open(io.BytesIO(cover.content))
        assert picture.format == 'JPEG' and picture.size == (1536, 1024)
        picture.verify()
        feed = requests.get('https://feed.addwine.ru/feed.xml', headers=headers, timeout=(10, 30))
        feed.raise_for_status()
        import xml.etree.ElementTree as ET
        xml = ET.fromstring(feed.content)
        items = xml.findall('./channel/item')
        pub = article['pub_date']
        if isinstance(pub, str):
            pub = parsedate_to_datetime(pub)
        held = (datetime.now(timezone.utc) - pub).total_seconds() < 86400
        visible = any(x.findtext('link') == article['link'] for x in items)
        assert not held or not visible
        assert before == (Path('posts/progress.json').read_bytes(), Path('feed_full.json').read_bytes())
        now = datetime.now(timezone.utc)
        next_daily = None
        for n in range(8):
            date = (now + timedelta(days=n)).date()
            dt = datetime(date.year, date.month, date.day, 8, 17, tzinfo=timezone.utc)
            if dt > now and dt.weekday() in (0, 2, 4):
                next_daily = dt.astimezone(ZoneInfo('Europe/Moscow')).isoformat()
                break
        week_posts = weekly_digest.load_posts_for_week()
        report = {'status': 'passed', 'text_model': claude_api.MODEL, 'image_model': openai_api.MODEL,
                  'live_seo_json': True, 'live_link_json': True, 'live_link_inserted_in_test_only': linked['link_inserted'],
                  'published_page_http': page.status_code, 'published_cover_http': cover.status_code,
                  'published_cover_sha256': hashlib.sha256(cover.content).hexdigest(),
                  'feed_http': feed.status_code, 'public_feed_items': len(items), 'article_in_feed': visible,
                  'held_by_24_hour_rule': held, 'cycle_position': state['cycle_position'],
                  'content_plan_index_unchanged': state['content_plan_index'], 'next_allowed_plan_index': selected,
                  'next_allowed_plan_number': row['number'], 'next_daily_moscow': next_daily,
                  'digest_articles_this_week': len(week_posts), 'digest_min_articles': 2,
                  'article_title': article['title'], 'article_url': article['link'],
                  'publication_files_unchanged': True, 'new_article_generated': False}
        Path('pipeline-audit.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n')
        print(json.dumps(report, ensure_ascii=False))

        AUDIT
    - name: Save audit receipt
      uses: actions/upload-artifact@v4
      with:
        name: dzen-pipeline-audit
        path: pipeline-audit.json
        retention-days: 7
