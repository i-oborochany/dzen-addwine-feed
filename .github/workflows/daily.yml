name: Daily Wine Post

on:
  schedule:
    # 10:17 МСК (07:17 UTC) — не на верхушке часа, меньше нагрузка на runner-ы
    - cron: "17 7 * * *"
    # Страховка: повтор через 30 минут, если первый не сработал.
    # Дедуп защитит от повторной публикации (бот проверяет уже опубликованные темы).
    - cron: "47 7 * * *"
    # Третий запуск через 2 часа на случай если GitHub полностью пропустил оба
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/main.py

      - name: Commit and push
        run: |
          git config user.name "addwine-bot"
          git config user.email "bot@addwine.local"
          git add feed.xml images/ posts/ index.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Daily post $(date -u +%Y-%m-%d)"
            git push
          fi
