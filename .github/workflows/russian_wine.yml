name: Russian Wine Post

on:
  schedule:
    # Каждые 3 дня в 13:00 МСК (10:00 UTC) — на 3 часа позже основной публикации,
    # чтобы не пересекаться с Daily Wine Post
    - cron: "0 10 1,4,7,10,13,16,19,22,25,28 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run Russian wine bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/main_russian.py

      - name: Commit and push
        run: |
          git config user.name "addwine-bot"
          git config user.email "bot@addwine.local"
          git add feed.xml images/ posts/ index.html sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Russian wine post $(date -u +%Y-%m-%d)"
            git push
          fi
