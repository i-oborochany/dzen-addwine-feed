name: Крепкий алкоголь

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Форсировать публикацию"
        type: boolean
        default: false
  schedule:
    # каждые 4 дня, дни 1,5,9,13,17,21,25,29 в 14:00 UTC (17:00 MSK)
    # НОВЫЙ ТЕМП (14.08.2026): суббота 1 раз/нед (крепкое+коктейли не более 1-2 в неделю).
    - cron: "0 14 * * 6"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RUBRIC: "spirits"
          FORCE_PUBLISH: ${{ inputs.force && '1' || '' }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/main_extras.py
      - name: Commit and push
        run: |
          git config user.name "spirits-bot"
          git config user.email "spirits-bot@local"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Spirits post $(date -u +%Y-%m-%d)"
            git push
          fi
