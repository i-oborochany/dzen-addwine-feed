name: Bootstrap project files

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_WORKFLOWS }}@github.com/${{ github.repository }}.git"

      - name: Deploy files
        run: |
          mkdir -p scripts
          echo '' | base64 -d > scripts/html_renderer.py
          echo '' | base64 -d > scripts/category_renderer.py
          echo '' | base64 -d > scripts/sitemap_gen.py
          echo '' | base64 -d > scripts/wordstat_api.py
          echo '' | base64 -d > scripts/seo_boost_recent.py

      - name: Boost last 10 posts via Wordstat (title + lead + meta)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YANDEX_WORDSTAT_API_KEY: ${{ secrets.YANDEX_WORDSTAT_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/seo_boost_recent.py

      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "SEO boost 10 recent posts (title/lead/meta) + category links on homepage"
            git push origin HEAD:main
          fi
