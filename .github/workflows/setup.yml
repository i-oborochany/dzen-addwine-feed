name: Bootstrap project files

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Configure git remote
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_WORKFLOWS }}@github.com/${{ github.repository }}.git"

      - name: Update files
        run: |
          echo '' | base64 -d > config.yaml
          echo '' | base64 -d > scripts/feed_io.py

      - name: Rewrite feed with new channel meta
        run: |
          cd scripts
          python3 << 'PYEOF'
          import yaml, feed_io, html_renderer, sitemap_gen
          from pathlib import Path
          config = yaml.safe_load(Path('../config.yaml').read_text())
          data = feed_io.read_feed()
          # подставляем новые channel-meta из config
          data['channel'] = {
            'title': config['channel']['title'],
            'link': config['channel']['link'],
            'description': config['channel']['description'],
            'language': config['channel']['language'],
          }
          feed_io.write_feed(data['channel'], data['items'])
          print(f"feed.xml: channel.link = {data['channel']['link']}, items: {len(data['items'])}")
          html_renderer.rebuild_from_feed('https://feed.addwine.ru')
          sitemap_gen.generate_all()
          PYEOF

      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Dzen final compliance: channel link to site, xmlns:georss, title update"
            git push origin HEAD:main
          fi
