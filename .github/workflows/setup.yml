name: Bootstrap project files

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install requests
      - name: Configure git
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_WORKFLOWS }}@github.com/${{ github.repository }}.git"
      - name: Deploy topvisor_api.py
        run: |
          mkdir -p scripts
          echo '' | base64 -d > scripts/topvisor_api.py
          echo 'Файл создан. Размер:' $(wc -c < scripts/topvisor_api.py) 'байт'
          head -30 scripts/topvisor_api.py
      - name: Diagnostic → пишем в файл TOPVISOR_DEBUG.txt
        env:
          TOPVISOR_USER_ID: ${{ secrets.TOPVISOR_USER_ID }}
          TOPVISOR_API_KEY: ${{ secrets.TOPVISOR_API_KEY }}
          TOPVISOR_PROJECT_ID: ${{ secrets.TOPVISOR_PROJECT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/topvisor_api.py > TOPVISOR_DEBUG.txt 2>&1 || echo "SCRIPT_EXIT_CODE=$?" >> TOPVISOR_DEBUG.txt
          echo "===== СОДЕРЖИМОЕ TOPVISOR_DEBUG.txt ====="
          cat TOPVISOR_DEBUG.txt || echo "(файл пустой или отсутствует)"
      - name: Commit & push debug file
        run: |
          git add -A
          git diff --cached --quiet || (git commit -m "Debug: topvisor diagnostic" && git push origin HEAD:main)
