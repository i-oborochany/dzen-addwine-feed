name: Bootstrap project files

on:
  workflow_dispatch:
    inputs:
      run_test:
        description: "Тест API с автополучением регионов"
        type: boolean
        default: true
      run_booster:
        description: "Дожать 3 статьи на позициях 4-15"
        type: boolean
        default: true

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_WORKFLOWS }}@github.com/${{ github.repository }}.git"

      - name: Deploy
        run: |
          mkdir -p scripts
          echo '' | base64 -d > scripts/topvisor_api.py
          echo '' | base64 -d > scripts/position_booster.py

      - name: Test with auto-detected regions
        if: ${{ inputs.run_test }}
        env:
          TOPVISOR_USER_ID: ${{ secrets.TOPVISOR_USER_ID }}
          TOPVISOR_API_KEY: ${{ secrets.TOPVISOR_API_KEY }}
          TOPVISOR_PROJECT_ID: ${{ secrets.TOPVISOR_PROJECT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'scripts')
          import topvisor_api, os
          pid = int(os.environ['TOPVISOR_PROJECT_ID'])
          regions = topvisor_api._get_project_regions(pid)
          print(f'Найдено регионов проекта: {len(regions)} → {regions}')
          print()
          positions = topvisor_api.get_positions(debug=True)
          print()
          print(f'=== Позиций получено: {len(positions)} ===')
          for p in positions[:30]:
              print(f'  {p[\"se\"]:6}  #{p[\"position\"]:3}  «{p[\"keyword\"][:55]}»  → {p[\"url\"][:50]}')
          print()
          candidates = topvisor_api.find_boost_candidates()
          print(f'=== Кандидатов на дожим (позиции 4-15): {len(candidates)} ===')
          for c in candidates[:10]:
              keys = ', '.join(f'«{k[\"kw\"]}» #{k[\"pos\"]}' for k in c['keywords'][:3])
              print(f'  {c[\"url\"]}')
              print(f'    {keys}')
          "

      - name: Boost articles
        if: ${{ inputs.run_booster }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOPVISOR_USER_ID: ${{ secrets.TOPVISOR_USER_ID }}
          TOPVISOR_API_KEY: ${{ secrets.TOPVISOR_API_KEY }}
          TOPVISOR_PROJECT_ID: ${{ secrets.TOPVISOR_PROJECT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/position_booster.py

      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Topvisor: auto-detect project regions"
            git push origin HEAD:main
          fi
