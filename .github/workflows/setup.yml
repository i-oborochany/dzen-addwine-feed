name: Bootstrap project files

on:
  workflow_dispatch:
    inputs:
      ping_all_urls:
        description: "Отправить все существующие URL в IndexNow (для первичной индексации 65 статей + 14 категорий)"
        type: boolean
        default: true

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_WORKFLOWS }}@github.com/${{ github.repository }}.git"

      - name: Deploy Release 1
        run: |
          mkdir -p scripts
          echo '' | base64 -d > scripts/indexnow_ping.py
          echo '' | base64 -d > scripts/html_sitemap.py
          echo '' | base64 -d > scripts/llms_txt_gen.py
          echo '' | base64 -d > scripts/html_renderer.py
          echo '' | base64 -d > scripts/publisher.py

      - name: Rebuild all HTML + sitemap + html-map + llms.txt + indexnow-key
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'scripts')
          import html_renderer
          try:
              html_renderer.rebuild_from_feed('https://feed.addwine.ru')
              print('✅ страницы статей пересобраны (Organization + WebSite schemas на главной)')
          except Exception as e:
              print(f'⚠️  rebuild_from_feed: {e}')
          try:
              html_renderer.rebuild_index()
              print('✅ главная + категории + sitemap + html-карта + llms.txt + indexnow-ключ')
          except Exception as e:
              print(f'⚠️  rebuild_index: {e}')
          "
          echo ""
          echo "== Проверка что новые файлы создались =="
          test -f llms.txt && echo "✅ llms.txt" || echo "❌ llms.txt"
          test -f sitemap-html/index.html && echo "✅ sitemap-html/index.html" || echo "❌ sitemap-html"
          ls a7f2c5d9e1b3f4a6c8e2b9d5f1a3c7e0.txt 2>/dev/null && echo "✅ indexnow key" || echo "❌ indexnow key"

      - name: Ping all URLs to IndexNow (первичная индексация в Яндексе)
        if: ${{ inputs.ping_all_urls }}
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -c "
          import sys, json
          sys.path.insert(0, 'scripts')
          import indexnow_ping
          from pathlib import Path

          urls = ['https://feed.addwine.ru/']

          # категории
          for slug in ['vino-kultura-i-lichnosti', 'vinnye-novosti', 'vino-i-puteshestviya',
                       'rossiyskoe-vinodelie', 'vino-i-eda', 'krepkiy-alkogol', 'pivo-i-sidr',
                       'kokteyli-i-bezalkogolnoe', 'kreplenye-i-desertnye-vina',
                       'tekhnologii-i-innovatsii', 'vino-i-dengi', 'aksessuary-dlya-vina',
                       'degustatsii-i-sovety', 'daydzhesty']:
              urls.append(f'https://feed.addwine.ru/category/{slug}/')

          # статьи
          try:
              posts = json.loads(Path('posts/posts_index.json').read_text(encoding='utf-8'))
              for p in posts:
                  urls.append(f'https://feed.addwine.ru/posts/{p[\"slug\"]}/')
          except Exception as e:
              print(f'⚠️  posts_index: {e}')

          urls.append('https://feed.addwine.ru/sitemap-html/')
          urls.append('https://feed.addwine.ru/sitemap.xml')

          print(f'Пингуем {len(urls)} URLs в IndexNow')
          indexnow_ping.ping_urls(urls)
          "

      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "SEO Release 1: IndexNow + HTML-sitemap + Organization/WebSite schemas + llms.txt"
            git push origin HEAD:main
          fi
