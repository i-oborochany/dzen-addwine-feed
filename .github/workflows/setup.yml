name: Bootstrap project files

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps + Pillow
        run: |
          pip install -r requirements.txt
          pip install Pillow

      - name: Configure git
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_WORKFLOWS }}@github.com/${{ github.repository }}.git"

      - name: Deploy
        run: |
          mkdir -p scripts
          echo '' | base64 -d > scripts/publisher.py
          echo '' | base64 -d > scripts/fix_digest_placeholders.py

      - name: Fix all existing digest placeholders [[IMG_N]] → real figures
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/fix_digest_placeholders.py

      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Fix: digest embed_images supports up to 50 images + rebuild existing digests"
            git push origin HEAD:main
          fi
