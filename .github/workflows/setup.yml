name: Bootstrap project files

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}
          persist-credentials: true
      - name: Configure git
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_WORKFLOWS }}@github.com/${{ github.repository }}.git"
      - name: Deploy new strategy files
        run: |
          mkdir -p scripts .github/workflows
          echo '' | base64 -d > scripts/main.py
          echo '' | base64 -d > scripts/writer.py
          echo '' | base64 -d > scripts/russian_writer.py
          echo '' | base64 -d > scripts/food_writer.py
          echo '' | base64 -d > scripts/extras_writer.py
          echo '' | base64 -d > scripts/stop_list.py
          echo '' | base64 -d > scripts/feed_io.py
          echo '' | base64 -d > scripts/html_renderer.py
          echo '' | base64 -d > scripts/sitemap_gen.py
          echo '' | base64 -d > editorial_topics.json
          echo '' | base64 -d > .github/workflows/daily.yml
          echo '' | base64 -d > .github/workflows/russian_wine.yml
          echo '' | base64 -d > .github/workflows/food.yml
          echo '' | base64 -d > .github/workflows/spirits.yml
          echo '' | base64 -d > .github/workflows/beer.yml
          echo '' | base64 -d > .github/workflows/water.yml
          echo '' | base64 -d > .github/workflows/fortified.yml
          echo "=== Проверка размеров задеплоенных файлов ==="
          wc -c scripts/main.py scripts/writer.py scripts/russian_writer.py scripts/food_writer.py scripts/extras_writer.py scripts/stop_list.py scripts/feed_io.py scripts/html_renderer.py scripts/sitemap_gen.py editorial_topics.json
          wc -c .github/workflows/daily.yml .github/workflows/russian_wine.yml .github/workflows/food.yml .github/workflows/spirits.yml .github/workflows/beer.yml .github/workflows/water.yml .github/workflows/fortified.yml
      - name: Sanity check python
        run: |
          python3 -c "import ast; [ast.parse(open('scripts/'+f).read()) for f in ['main.py','writer.py','russian_writer.py','food_writer.py','extras_writer.py','stop_list.py','feed_io.py','html_renderer.py','sitemap_gen.py']]; print('All python files OK')"
          python3 scripts/stop_list.py
      - name: Commit & push
        run: |
          git add -A
          git diff --cached --quiet || (git commit -m "Новая стратегия 14.08.2026: темп 4-5/нед, стоп-лист, Дзен-задержка 24ч, ссылки <=3, автор Редакция, темы" && git push origin HEAD:main)
