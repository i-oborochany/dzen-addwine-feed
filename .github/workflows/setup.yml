name: Bootstrap project files

on:
  workflow_dispatch:
    inputs:
      run_refresh:
        description: "Актуализировать 5 самых старых статей (>90 дней)"
        type: boolean
        default: true
      check_canibalization:
        description: "Показать отчёт по каннибализации ключей"
        type: boolean
        default: true

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_WORKFLOWS }}@github.com/${{ github.repository }}.git"

      - name: Deploy Release 2
        run: |
          mkdir -p scripts
          echo '' | base64 -d > scripts/auto_refresh.py
          echo '' | base64 -d > scripts/canibalization_check.py
          echo '' | base64 -d > scripts/html_renderer.py

      - name: Canibalization check (отчёт)
        if: ${{ inputs.check_canibalization }}
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/canibalization_check.py

      - name: Auto-refresh 5 старых статей (>90 дней)
        if: ${{ inputs.run_refresh }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/auto_refresh.py

      - name: Rebuild HTML (Person schema + refresh style)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'scripts')
          import html_renderer
          try:
              html_renderer.rebuild_from_feed('https://feed.addwine.ru')
              html_renderer.rebuild_index()
              print('✅ HTML пересобран')
          except Exception as e:
              print(f'⚠️  {e}')
          "

      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "SEO Release 2: auto-refresh agent + Person schema + canibalization check"
            git push origin HEAD:main
          fi
