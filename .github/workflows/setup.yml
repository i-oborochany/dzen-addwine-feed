name: Bootstrap project files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update html_renderer
        run: |
          echo '' | base64 -d > scripts/html_renderer.py

      - name: Regenerate index and post pages from feed.xml
        run: |
          cd scripts
          python3 -c "
          import html_renderer
          html_renderer.rebuild_from_feed('https://feed.addwine.ru')
          print('Готово')
          "

      - name: Commit and push
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git add scripts/ posts/ index.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Redesign: blog UI matches addwine.ru style"
            git push
          fi
