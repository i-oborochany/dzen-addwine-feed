name: Bootstrap project files

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_WORKFLOWS }}@github.com/${{ github.repository }}.git"

      - name: Deploy files
        run: |
          mkdir -p scripts .github/workflows
          echo '' | base64 -d > scripts/writer.py
          echo '' | base64 -d > scripts/russian_writer.py
          echo '' | base64 -d > scripts/food_writer.py
          echo '' | base64 -d > scripts/main.py
          echo '' | base64 -d > scripts/main_russian.py
          echo '' | base64 -d > scripts/main_food.py
          echo '' | base64 -d > scripts/weekly_digest.py
          echo '' | base64 -d > scripts/main_digest.py
          echo '' | base64 -d > russian_topics.json
          echo '' | base64 -d > food_topics.json
          echo '' | base64 -d > food_categories.json
          echo '' | base64 -d > .github/workflows/food.yml
          echo '' | base64 -d > .github/workflows/russian_wine.yml

      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "1 image per article + food rubric + digest-trailer of own posts"
            git push origin HEAD:main
          fi
