name: Bootstrap project files

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Deploy test scripts
        run: |
          mkdir -p scripts
          echo '' | base64 -d > scripts/wordstat_api.py
          echo '' | base64 -d > scripts/test_wordstat.py

      - name: Verify wordstat_api.py deployed correctly
        run: |
          echo "== фильтр внутри wordstat_api.py =="
          grep -c "ADULT_STOPWORDS" scripts/wordstat_api.py || echo "0"
          grep -c "_is_relevant" scripts/wordstat_api.py || echo "0"
          echo "== associations должно быть только в комментарии, не в парсинге =="
          grep -n "associations" scripts/wordstat_api.py

      - name: Test Wordstat API connection
        env:
          YANDEX_WORDSTAT_API_KEY: ${{ secrets.YANDEX_WORDSTAT_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/test_wordstat.py
