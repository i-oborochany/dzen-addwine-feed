name: Bootstrap project files

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Configure git remote
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_WORKFLOWS }}@github.com/${{ github.repository }}.git"

      - name: Update feed_io.py
        run: |
          echo '' | base64 -d > scripts/feed_io.py

      - name: Rewrite feed.xml in strict Dzen format
        run: |
          cd scripts
          python3 -c "
          import feed_io, html_renderer, sitemap_gen
          data = feed_io.read_feed()
          feed_io.write_feed(data['channel'], data['items'])
          print(f'feed.xml перезаписан, статей: {len(data[\"items\"])}')
          html_renderer.rebuild_from_feed('https://feed.addwine.ru')
          sitemap_gen.generate_all()
          print('страницы и sitemap обновлены')
          "

      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Dzen strict compliance: xmlns:media + media:rating + single category"
            git push origin HEAD:main
          fi
