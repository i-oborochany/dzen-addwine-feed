name: Bootstrap project files

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}
          persist-credentials: true
      - name: Configure git
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_WORKFLOWS }}@github.com/${{ github.repository }}.git"
      - name: Deploy quiet luxury image style
        run: |
          mkdir -p scripts
          echo '' | base64 -d > scripts/image_style.py
          echo '' | base64 -d > scripts/main.py
          echo '' | base64 -d > scripts/main_russian.py
          echo '' | base64 -d > scripts/main_food.py
          echo '' | base64 -d > scripts/main_extras.py
          echo '' | base64 -d > scripts/writer.py
          echo '' | base64 -d > scripts/russian_writer.py
          echo '' | base64 -d > scripts/food_writer.py
          wc -c scripts/image_style.py scripts/main.py scripts/main_russian.py scripts/main_food.py scripts/main_extras.py scripts/writer.py scripts/russian_writer.py scripts/food_writer.py
      - name: Sanity check
        run: |
          python3 -c "import ast; [ast.parse(open('scripts/'+f).read()) for f in ['image_style.py','main.py','main_russian.py','main_food.py','main_extras.py','writer.py','russian_writer.py','food_writer.py']]; print('All OK')"
          cd scripts && python3 image_style.py && cd ..
          rm -f images_style_log.json
      - name: Commit & push
        run: |
          git add -A
          git diff --cached --quiet || (git commit -m "Стиль картинок: quiet luxury + журнал сцен с запретом повторов" && git push origin HEAD:main)
