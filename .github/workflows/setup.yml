name: Bootstrap project files

on:
  workflow_dispatch:
    inputs:
      publish_now:
        description: "Опубликовать первую русскую статью сразу (~$0.18)"
        type: boolean
        default: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Configure git remote
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_WORKFLOWS }}@github.com/${{ github.repository }}.git"

      - name: Deploy Russian wine module
        run: |
          echo '' | base64 -d > russian_topics.json
          echo '' | base64 -d > scripts/russian_writer.py
          echo '' | base64 -d > scripts/main_russian.py
          echo '' | base64 -d > .github/workflows/russian_wine.yml

      - name: Push code first
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Add Russian wine content track: every 3 days"
            git push origin HEAD:main
          fi

      - name: First Russian publication
        if: ${{ inputs.publish_now }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FORCE_PUBLISH: "1"
          PYTHONUNBUFFERED: "1"
        run: python scripts/main_russian.py

      - name: Push first article
        if: ${{ inputs.publish_now }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "First Russian wine post"
            git push origin HEAD:main
          fi
