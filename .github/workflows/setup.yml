name: Bootstrap project files

on:
  workflow_dispatch:
    inputs:
      publish_test_digest:
        description: "Опубликовать тестовый дайджест за 1-7 июня (~$0.40)"
        type: boolean
        default: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Configure git remote
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_WORKFLOWS }}@github.com/${{ github.repository }}.git"

      - name: Deploy digest module
        run: |
          echo '' | base64 -d > scripts/digest_sources.py
          echo '' | base64 -d > scripts/weekly_digest.py
          echo '' | base64 -d > scripts/main_digest.py
          echo '' | base64 -d > .github/workflows/weekly_digest.yml

      - name: Push code first
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit (code already deployed)"
          else
            git commit -m "Weekly digest: 4 sources + Sunday cron + date window"
            git push origin HEAD:main
          fi

      - name: Test digest for June 1-7
        if: ${{ inputs.publish_test_digest }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DIGEST_DATE_FROM: "2026-06-01"
          DIGEST_DATE_TO: "2026-06-07"
          FORCE_PUBLISH: "1"
          PYTHONUNBUFFERED: "1"
        run: python scripts/main_digest.py

      - name: Push test digest
        if: ${{ inputs.publish_test_digest }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Test weekly digest: June 1-7"
            git push origin HEAD:main
          fi
