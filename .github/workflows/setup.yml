name: Bootstrap project files

on:
  workflow_dispatch:
    inputs:
      publish_today:
        description: "Опубликовать статью прямо сейчас (затратно $0.13)"
        type: boolean
        default: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Configure git remote
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_WORKFLOWS }}@github.com/${{ github.repository }}.git"

      - name: Update project files
        run: |
          echo '' | base64 -d > scripts/main.py
          echo '' | base64 -d > .github/workflows/daily.yml

      - name: Push code changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Add reliable cron schedule + idempotency guard"
            git push origin HEAD:main
          fi

      - name: Publish today's article
        if: ${{ inputs.publish_today }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RECRAFT_API_KEY: ${{ secrets.RECRAFT_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/main.py

      - name: Push article after publish
        if: ${{ inputs.publish_today }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Daily post (manual via setup)"
            git push origin HEAD:main
          fi
