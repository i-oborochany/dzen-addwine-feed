name: Bootstrap project files

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install requests anthropic
      - name: Configure git
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_WORKFLOWS }}@github.com/${{ github.repository }}.git"
      - name: Deploy extract_keywords_for_topvisor.py
        run: |
          mkdir -p scripts
          echo '' | base64 -d > scripts/extract_keywords_for_topvisor.py
          echo 'Файл создан. Размер:' $(wc -c < scripts/extract_keywords_for_topvisor.py) 'байт'
      - name: Run keyword extraction
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/extract_keywords_for_topvisor.py
      - name: Commit & push keywords file
        run: |
          git add -A
          git diff --cached --quiet || (git commit -m "Add Topvisor keywords list" && git push origin HEAD:main)
