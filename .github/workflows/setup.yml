name: Bootstrap project files

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout (with PAT for workflow file writes)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Update project files
        run: |
          echo '' | base64 -d > scripts/writer.py
          echo '' | base64 -d > scripts/publisher.py
          echo '' | base64 -d > scripts/migrate_images.py
          echo '' | base64 -d > .github/workflows/daily.yml

      - name: Run image migration for all existing articles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RECRAFT_API_KEY: ${{ secrets.RECRAFT_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/migrate_images.py

      - name: Commit and push
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Migration: regenerate images via Recraft, inline placement by scenario"
            git push
          fi
