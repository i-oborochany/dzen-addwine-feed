name: Bootstrap project files

on:
  workflow_dispatch:
    inputs:
      test_publish:
        description: "Опубликовать тестовую статью с 3 фото ($0.13)"
        type: boolean
        default: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Configure git remote
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_WORKFLOWS }}@github.com/${{ github.repository }}.git"

      - name: Update project files
        run: |
          echo '' | base64 -d > scripts/writer.py
          echo '' | base64 -d > scripts/main.py
          echo '' | base64 -d > scripts/publisher.py

      - name: Push code changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "3 images per article: header (with text) + problem + solution"
            git push origin HEAD:main
          fi

      - name: Force publish test article
        if: ${{ inputs.test_publish }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FORCE_PUBLISH: "1"
          PYTHONUNBUFFERED: "1"
        run: python scripts/main.py

      - name: Push test article
        if: ${{ inputs.test_publish }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Test article with 3 images"
            git push origin HEAD:main
          fi
