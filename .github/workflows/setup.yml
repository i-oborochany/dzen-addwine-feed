name: Bootstrap project files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update files
        run: |
          echo '' | base64 -d > scripts/html_renderer.py
          echo '' | base64 -d > scripts/publisher.py

      - name: Migrate existing feed.xml to HTML pages
        run: |
          cd scripts
          python3 -c "
          import html_renderer
          html_renderer.rebuild_from_feed('https://feed.addwine.ru')
          print('Миграция завершена')
          "

      - name: Commit and push
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git add scripts/ posts/ index.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Blog UI: pretty index + post pages, migration from feed.xml"
            git push
          fi
