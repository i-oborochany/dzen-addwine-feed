name: Bootstrap project files

on:
  workflow_dispatch:
    inputs:
      boost_10_recent:
        description: "Заново прогнать 10 последних статей через SEO-boost (перепишет title/lead)"
        type: boolean
        default: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_WORKFLOWS }}@github.com/${{ github.repository }}.git"

      - name: Deploy new SEO planner + updated writers
        run: |
          mkdir -p scripts
          echo '' | base64 -d > scripts/seo_planner.py
          echo '' | base64 -d > scripts/wordstat_api.py
          echo '' | base64 -d > scripts/main.py
          echo '' | base64 -d > scripts/main_russian.py
          echo '' | base64 -d > scripts/main_food.py
          echo '' | base64 -d > scripts/main_extras.py
          echo '' | base64 -d > scripts/seo_boost_recent.py

      - name: Push code
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "SEO-first: articles are written UNDER Wordstat keywords, not around them"
            git push origin HEAD:main
          fi

      - name: Optional — rerun boost on last 10 recent posts
        if: ${{ inputs.boost_10_recent }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YANDEX_WORDSTAT_API_KEY: ${{ secrets.YANDEX_WORDSTAT_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/seo_boost_recent.py

      - name: Push boost changes
        if: ${{ inputs.boost_10_recent }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Boost 10 recent posts with new SEO planner"
            git push origin HEAD:main
          fi
