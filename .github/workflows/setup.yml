name: Bootstrap project files

on:
  workflow_dispatch:
    inputs:
      publish_test_article:
        description: "Опубликовать тестовую статью прямо сейчас вне расписания (~$0.16)"
        type: boolean
        default: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Configure git remote
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_WORKFLOWS }}@github.com/${{ github.repository }}.git"

      - name: Deploy native-link module
        run: |
          echo '' | base64 -d > scripts/addwine_linker.py
          echo '' | base64 -d > scripts/writer.py
          echo '' | base64 -d > scripts/feed_io.py
          echo '' | base64 -d > scripts/main.py
          echo '' | base64 -d > scripts/main_russian.py

      - name: Push code first
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit (code already deployed)"
          else
            git commit -m "Native AddWine links: pick from sitemaps, inject in each article"
            git push origin HEAD:main
          fi

      - name: Force test publication
        if: ${{ inputs.publish_test_article }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FORCE_PUBLISH: "1"
          PYTHONUNBUFFERED: "1"
        run: python scripts/main.py

      - name: Push test article
        if: ${{ inputs.publish_test_article }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Test article with native AddWine link"
            git push origin HEAD:main
          fi
