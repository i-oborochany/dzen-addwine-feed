name: Bootstrap project files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write CNAME, index.html and updated config
        run: |
          echo 'ZmVlZC5hZGR3aW5lLnJ1Cg==' | base64 -d > CNAME
          echo '' | base64 -d > index.html
          echo '' | base64 -d > config.yaml

      - name: Update existing URLs in feed.xml
        run: |
          # старый URL -> новый (поддомен)
          if [ -f feed.xml ]; then
            sed -i 's|https://i-oborochany.github.io/dzen-addwine-feed|https://feed.addwine.ru|g' feed.xml
          fi

      - name: Commit and push
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git add CNAME index.html config.yaml feed.xml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Setup custom domain feed.addwine.ru and Yandex verification"
            git push
          fi
