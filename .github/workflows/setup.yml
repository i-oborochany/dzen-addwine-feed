name: Bootstrap project files

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_WORKFLOWS }}@github.com/${{ github.repository }}.git"

      - name: Deploy fix
        run: |
          mkdir -p scripts
          echo '' | base64 -d > scripts/html_renderer.py

      - name: Rebuild all pages with fixed CSS
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'scripts')
          import html_renderer
          try:
              html_renderer.rebuild_from_feed('https://feed.addwine.ru')
              print('✅ Все страницы статей пересобраны')
          except Exception as e:
              print(f'⚠️  rebuild_from_feed упал: {e}')
          try:
              html_renderer.rebuild_index()
              print('✅ Главная + категории + sitemap пересобраны')
          except Exception as e:
              print(f'⚠️  rebuild_index упал: {e}')
          "

      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Fix: stretched images in post body (add height:auto)"
            git push origin HEAD:main
          fi
