name: Bootstrap project files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create directories
        run: mkdir -p scripts images posts

      - name: Write project files
        run: |
          echo '' | base64 -d > config.yaml
          echo 'cmVxdWVzdHM+PTIuMzEKZmVlZHBhcnNlcj49Ni4wCmJlYXV0aWZ1bHNvdXA0Pj00LjEyCmx4bWw+PTUuMApQeVlBTUw+PTYuMApweXRob24tZGF0ZXV0aWw+PTIuOAo=' | base64 -d > requirements.txt
          echo '' | base64 -d > scripts/gigachat.py
          echo '' | base64 -d > scripts/sources.py
          echo '' | base64 -d > scripts/picker.py
          echo '' | base64 -d > scripts/writer.py
          echo '' | base64 -d > scripts/publisher.py
          echo '' | base64 -d > scripts/main.py

      - name: Touch images and posts directories
        run: touch images/.gitkeep posts/.gitkeep

      - name: Commit and push
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git add .
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Bootstrap project files"
            git push
          fi
