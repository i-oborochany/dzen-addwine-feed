name: Bootstrap project files

on:
  workflow_dispatch:
    inputs:
      rewrite_all:
        description: "Переписать ВСЕ 60+ существующих статей под новую SEO-схему (займёт 30+ мин, ~$3-4)"
        type: boolean
        default: true

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (with Pillow)
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_WORKFLOWS }}@github.com/${{ github.repository }}.git"

      - name: Deploy all files
        run: |
          mkdir -p scripts
          echo 'cmVxdWVzdHM+PTIuMzEKZmVlZHBhcnNlcj49Ni4wCmJlYXV0aWZ1bHNvdXA0Pj00LjEyCmx4bWw+PTUuMApQeVlBTUw+PTYuMApweXRob24tZGF0ZXV0aWw+PTIuOAphbnRocm9waWM+PTAuNDAKUGlsbG93Pj0xMC4wCg==' | base64 -d > requirements.txt
          echo '' | base64 -d > scripts/html_renderer.py
          echo '' | base64 -d > scripts/category_renderer.py
          echo '' | base64 -d > scripts/sitemap_gen.py
          echo '' | base64 -d > scripts/publisher.py
          echo '' | base64 -d > scripts/writer.py
          echo '' | base64 -d > scripts/russian_writer.py
          echo '' | base64 -d > scripts/food_writer.py
          echo '' | base64 -d > scripts/extras_writer.py
          echo '' | base64 -d > scripts/seo_planner.py
          echo '' | base64 -d > scripts/wordstat_api.py
          echo '' | base64 -d > scripts/dedup.py
          echo '' | base64 -d > scripts/rewrite_all_articles.py
          echo '' | base64 -d > scripts/generate_webp_bulk.py

      - name: Generate WebP versions for all existing cover images
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/generate_webp_bulk.py

      - name: Rewrite all existing articles (if enabled)
        if: ${{ inputs.rewrite_all }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YANDEX_WORDSTAT_API_KEY: ${{ secrets.YANDEX_WORDSTAT_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/rewrite_all_articles.py

      - name: Rebuild all pages regardless (schemas + autolink + FAQ + WebP <picture>)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'scripts')
          import html_renderer
          try:
              html_renderer.rebuild_from_feed('https://feed.addwine.ru')
              print('✅ Все страницы статей пересобраны')
          except Exception as e:
              print(f'⚠️  rebuild_from_feed: {e}')
          try:
              html_renderer.rebuild_index()
              print('✅ Главная + категории + sitemap')
          except Exception as e:
              print(f'⚠️  rebuild_index: {e}')
          "

      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Big SEO release: FAQPage + HowTo schemas + autolink + WebP + full rewrite + trust boost"
            git push origin HEAD:main
          fi
