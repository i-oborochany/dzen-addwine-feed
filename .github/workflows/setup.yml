name: Bootstrap project files

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Configure git remote
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_WORKFLOWS }}@github.com/${{ github.repository }}.git"

      - name: Update html_renderer
        run: |
          echo '' | base64 -d > scripts/html_renderer.py

      - name: Rebuild pages, sitemap, robots
        run: |
          cd scripts
          python3 -c "
          import html_renderer, sitemap_gen
          html_renderer.rebuild_from_feed('https://feed.addwine.ru')
          sitemap_gen.generate_all()
          print('OK')
          "

      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Redesign: blog like addwine.ru/articles — flat cards, text categories, 4 cols"
            git push origin HEAD:main
          fi
