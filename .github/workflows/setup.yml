name: Bootstrap project files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update files
        run: |
          echo '' | base64 -d > scripts/gigachat.py

      - name: Commit and push
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git add scripts/gigachat.py
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "GigaChat: increase timeout and add retries for image generation"
            git push
          fi
