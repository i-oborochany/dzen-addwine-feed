name: Bootstrap project files

on:
  workflow_dispatch:
    inputs:
      run_test:
        description: "Тест API Топвизора (проверить что доступы работают)"
        type: boolean
        default: true
      run_booster:
        description: "Прогнать дожим 3 статей с позиций 4-15"
        type: boolean
        default: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_WORKFLOWS }}@github.com/${{ github.repository }}.git"

      - name: Deploy Release 3
        run: |
          mkdir -p scripts
          echo '' | base64 -d > scripts/topvisor_api.py
          echo '' | base64 -d > scripts/position_booster.py

      - name: Test Topvisor API connection
        if: ${{ inputs.run_test }}
        env:
          TOPVISOR_USER_ID: ${{ secrets.TOPVISOR_USER_ID }}
          TOPVISOR_API_KEY: ${{ secrets.TOPVISOR_API_KEY }}
          TOPVISOR_PROJECT_ID: ${{ secrets.TOPVISOR_PROJECT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/topvisor_api.py

      - name: Boost 3 articles on positions 4-15
        if: ${{ inputs.run_booster }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOPVISOR_USER_ID: ${{ secrets.TOPVISOR_USER_ID }}
          TOPVISOR_API_KEY: ${{ secrets.TOPVISOR_API_KEY }}
          TOPVISOR_PROJECT_ID: ${{ secrets.TOPVISOR_PROJECT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/position_booster.py

      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "SEO Release 3: Topvisor API + position booster (4-15 → top-3)"
            git push origin HEAD:main
          fi
