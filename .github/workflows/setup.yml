name: Bootstrap project files

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Configure git remote
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_WORKFLOWS }}@github.com/${{ github.repository }}.git"

      - name: Deploy all updates
        run: |
          mkdir -p scripts .github/workflows
          echo '' | base64 -d > russian_topics.json
          echo '' | base64 -d > food_topics.json
          echo '' | base64 -d > food_categories.json
          echo '' | base64 -d > scripts/food_writer.py
          echo '' | base64 -d > scripts/main_food.py
          echo '' | base64 -d > scripts/main_digest.py
          echo '' | base64 -d > .github/workflows/food.yml
          echo '' | base64 -d > .github/workflows/russian_wine.yml
          echo '' | base64 -d > scripts/fix_specific_digests.py

      - name: Push code first (before running fix)
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "Add food rubric + fix digest images + expand russian topics"
            git push origin HEAD:main
          fi

      - name: Regen images in 3 target old digests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/fix_specific_digests.py

      - name: Push regenerated covers
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit after regen"
          else
            git commit -m "Regen covers in 3 old digests"
            git push origin HEAD:main
          fi
