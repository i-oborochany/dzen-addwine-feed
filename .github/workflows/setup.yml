name: Bootstrap project files

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install requests
      - name: Configure git
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_WORKFLOWS }}@github.com/${{ github.repository }}.git"
      - name: Deploy fix files
        run: |
          mkdir -p scripts .github/workflows
          echo '' | base64 -d > scripts/main.py
          echo '' | base64 -d > scripts/restore_feed.py
          echo '' | base64 -d > .github/workflows/daily.yml
          echo '' | base64 -d > .github/workflows/russian_wine.yml
          echo '' | base64 -d > .github/workflows/weekly_digest.yml
          wc -c scripts/main.py scripts/restore_feed.py .github/workflows/daily.yml .github/workflows/russian_wine.yml .github/workflows/weekly_digest.yml
      - name: Restore lost feed items (15-19 Aug)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/restore_feed.py
          echo "=== Даты в новом feed.xml (топ-10):"
          grep -o "<pubDate>[^<]*</pubDate>" feed.xml | head -10
      - name: Commit & push
        run: |
          git add -A
          git diff --cached --quiet || (git commit -m "Fix: feed_full.json в коммитах, гейт Пн/Ср/Пт, восстановление статей 15-19 авг" && git push origin HEAD:main)
