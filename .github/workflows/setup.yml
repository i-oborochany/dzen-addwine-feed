name: Bootstrap project files

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Configure git
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_WORKFLOWS }}@github.com/${{ github.repository }}.git"
      - name: Deploy fixed claude_api.py
        run: |
          mkdir -p scripts
          echo '' | base64 -d > scripts/claude_api.py
          wc -c scripts/claude_api.py
      - name: Publish missed Friday article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FORCE_PUBLISH: "1"
          PYTHONUNBUFFERED: "1"
        run: python scripts/main.py
      - name: Commit & push
        run: |
          git add -A
          git diff --cached --quiet || (git commit -m "Fix: совместимость с новым anthropic SDK (temperature) + пятничная статья" && git push origin HEAD:main)
      - name: Ping IndexNow after deploy
        if: success()
        run: |
          pip install requests -q
          python scripts/ping_recent.py || echo "ping не критичен"
