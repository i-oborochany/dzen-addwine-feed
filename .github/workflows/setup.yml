name: Bootstrap project files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update files
        run: |
          echo '' | base64 -d > scripts/claude_api.py
          echo '' | base64 -d > scripts/progress.py
          echo '' | base64 -d > scripts/writer.py
          echo '' | base64 -d > scripts/sources.py
          echo '' | base64 -d > scripts/main.py
          echo '' | base64 -d > content_plan.json
          echo 'cmVxdWVzdHM+PTIuMzEKZmVlZHBhcnNlcj49Ni4wCmJlYXV0aWZ1bHNvdXA0Pj00LjEyCmx4bWw+PTUuMApQeVlBTUw+PTYuMApweXRob24tZGF0ZXV0aWw+PTIuOAphbnRocm9waWM+PTAuNDAK' | base64 -d > requirements.txt

      - name: Commit and push
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git add scripts/ content_plan.json requirements.txt
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Refactor: Claude for text, GigaChat for images, 5-article cycle"
            git push
          fi
