name: Bootstrap project files

on:
  workflow_dispatch:
    inputs:
      publish_first_spirits:
        description: "Выпустить первую статью «Крепкий алкоголь» прямо сейчас"
        type: boolean
        default: true

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_WORKFLOWS }}@github.com/${{ github.repository }}.git"

      - name: Deploy fixes
        run: |
          mkdir -p scripts .github/workflows
          echo '' | base64 -d > scripts/extras_writer.py
          echo '' | base64 -d > scripts/main_extras.py
          echo '' | base64 -d > scripts/weekly_digest.py

      - name: Push fixes first
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Fix: robust validation + digest chronological order"
            git push origin HEAD:main
          fi

      - name: Publish first Spirits article (with detailed logs)
        if: ${{ inputs.publish_first_spirits }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RUBRIC: "spirits"
          FORCE_PUBLISH: "1"
          PYTHONUNBUFFERED: "1"
        run: python scripts/main_extras.py

      - name: Push first article
        if: ${{ inputs.publish_first_spirits }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit after first article"
          else
            git commit -m "First Spirits article (manual)"
            git push origin HEAD:main
          fi
