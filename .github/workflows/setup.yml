name: Bootstrap project files

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Configure git remote with PAT
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_WORKFLOWS }}@github.com/${{ github.repository }}.git"

      - name: Update project files
        run: |
          echo '' | base64 -d > scripts/writer.py
          echo '' | base64 -d > scripts/main.py
          echo '' | base64 -d > scripts/cleanup_images.py

      - name: Run cleanup — keep only cover-1 in each article
        run: python scripts/cleanup_images.py

      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Simplify: one image per article (cover only)"
            git push origin HEAD:main
          fi
