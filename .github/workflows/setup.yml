name: Bootstrap project files

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_WORKFLOWS }}@github.com/${{ github.repository }}.git"

      - name: Deploy
        run: |
          mkdir -p scripts
          echo '' | base64 -d > scripts/writer.py
          echo '' | base64 -d > scripts/food_writer.py
          echo '' | base64 -d > spirits_config.json
          echo '' | base64 -d > scripts/sitemap_gen.py
          echo '' | base64 -d > scripts/publisher.py

      - name: Regenerate robots.txt with 3 sitemaps
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'scripts')
          import sitemap_gen
          sitemap_gen.generate_all()
          print('✅ robots.txt + все sitemaps')
          "

      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Fix: remove brand names from image prompts (Vogue/Conde Nast/etc.) + explicit NO TEXT rule"
            git push origin HEAD:main
          fi
