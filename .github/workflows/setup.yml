name: Bootstrap project files

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure git
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_WORKFLOWS }}@github.com/${{ github.repository }}.git"
      - name: Deploy feed releaser
        run: |
          mkdir -p scripts .github/workflows
          echo '' | base64 -d > scripts/feed_release.py
          echo '' | base64 -d > .github/workflows/feed_release.yml
          wc -c scripts/feed_release.py .github/workflows/feed_release.yml
      - name: Run release now
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/feed_release.py
          echo "=== Верхние даты feed.xml после релиза:"
          grep -o "<pubDate>[^<]*</pubDate>" feed.xml | head -5
      - name: Commit & push
        run: |
          git add -A
          git diff --cached --quiet || (git commit -m "Релизер Дзен-фида: выпуск созревших статей каждые 3 часа" && git push origin HEAD:main)
