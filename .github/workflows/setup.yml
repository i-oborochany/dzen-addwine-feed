name: Bootstrap project files

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (using PAT for workflow permissions)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update daily.yml
        run: |
          echo '' | base64 -d > .github/workflows/daily.yml

      - name: Rebuild index.html and post pages from feed.xml
        run: |
          cd scripts
          python3 -c "
          import html_renderer
          html_renderer.rebuild_from_feed('https://feed.addwine.ru')
          print('Готово')
          "

      - name: Commit and push
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git add .github/workflows/daily.yml index.html posts/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Auto-deploy: fix daily.yml + rebuild index.html"
            git push
          fi
