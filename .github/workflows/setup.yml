name: Bootstrap project files

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_WORKFLOWS }}@github.com/${{ github.repository }}.git"

      - name: Deploy files
        run: |
          mkdir -p scripts
          echo '' | base64 -d > scripts/wordstat_api.py
          echo '' | base64 -d > scripts/html_renderer.py
          echo '' | base64 -d > scripts/writer.py
          echo '' | base64 -d > scripts/russian_writer.py
          echo '' | base64 -d > scripts/food_writer.py
          echo '' | base64 -d > scripts/extras_writer.py
          echo '' | base64 -d > scripts/main.py
          echo '' | base64 -d > scripts/main_russian.py
          echo '' | base64 -d > scripts/main_food.py
          echo '' | base64 -d > scripts/main_extras.py

      - name: Rebuild all existing post pages with new SEO (lazy loading, breadcrumb schema, alt tags, meta desc)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'scripts')
          import html_renderer
          try:
              html_renderer.rebuild_from_feed('https://feed.addwine.ru')
              print('✅ Все страницы статей пересобраны')
          except Exception as e:
              print(f'⚠️  rebuild_from_feed упал: {e}')
              try:
                  html_renderer.rebuild_index()
                  print('✅ Хотя бы главная пересобрана')
              except Exception as e2:
                  print(f'⚠️  rebuild_index тоже упал: {e2}')
          "

      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "SEO: Wordstat integration + lazy loading + BreadcrumbList + alt tags + meta desc"
            git push origin HEAD:main
          fi
