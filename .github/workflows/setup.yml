name: Bootstrap project files

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}
          persist-credentials: true
      - name: Configure git
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_WORKFLOWS }}@github.com/${{ github.repository }}.git"
      - name: Deploy updated stop list
        run: |
          mkdir -p scripts
          echo '' | base64 -d > scripts/stop_list.py
          echo '' | base64 -d > editorial_topics.json
          wc -c scripts/stop_list.py editorial_topics.json
      - name: Sanity check
        run: |
          python3 -c "import ast; ast.parse(open('scripts/stop_list.py').read()); print('OK')"
          cd scripts && python3 stop_list.py && cd ..
          python3 -c "import json; d=json.load(open('editorial_topics.json')); print('тем:', len(d['topics']))"
      - name: Commit & push
        run: |
          git add -A
          git diff --cached --quiet || (git commit -m "Стоп-лист: безалкогольная тема + бренды (ТЗ 20.08)" && git push origin HEAD:main)
