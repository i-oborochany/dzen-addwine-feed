name: Bootstrap project files

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_WORKFLOWS }}@github.com/${{ github.repository }}.git"

      - name: Deploy dedup module + updated writers
        run: |
          mkdir -p scripts
          echo '' | base64 -d > scripts/dedup.py
          echo '' | base64 -d > scripts/russian_writer.py
          echo '' | base64 -d > scripts/food_writer.py
          echo '' | base64 -d > scripts/extras_writer.py
          echo '' | base64 -d > scripts/main_russian.py
          echo '' | base64 -d > scripts/main_food.py
          echo '' | base64 -d > scripts/main_extras.py

      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Semantic topic dedup 90 days (Negroni, Kaberne, single-malt no repeats)"
            git push origin HEAD:main
          fi
