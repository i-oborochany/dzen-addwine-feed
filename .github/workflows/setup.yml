name: Bootstrap project files

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Configure git remote
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_WORKFLOWS }}@github.com/${{ github.repository }}.git"

      - name: Update files
        run: |
          echo '' | base64 -d > scripts/feed_io.py
          echo '' | base64 -d > scripts/writer.py
          echo '' | base64 -d > scripts/rewrite_titles.py

      - name: Rewrite clickbait titles (Claude)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/rewrite_titles.py

      - name: Final feed cleanup (no CTA, figcaption, etc)
        run: |
          cd scripts
          python3 -c "
          import feed_io, html_renderer, sitemap_gen
          data = feed_io.read_feed()
          feed_io.write_feed(data['channel'], data['items'])
          html_renderer.rebuild_from_feed('https://feed.addwine.ru')
          sitemap_gen.generate_all()
          print('Готово')
          "

      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Dzen compliance: anti-clickbait + remove CTA + figcaption"
            git push origin HEAD:main
          fi
