name: Bootstrap project files

on:
  workflow_dispatch:
    inputs:
      run_migration:
        description: "Запустить миграцию картинок (затратно $2.25)"
        type: boolean
        default: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Configure git remote with PAT
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_WORKFLOWS }}@github.com/${{ github.repository }}.git"
          git remote -v | sed 's|x-access-token:[^@]*@|x-access-token:***@|'

      - name: Update project files
        run: |
          echo '' | base64 -d > scripts/writer.py
          echo '' | base64 -d > scripts/publisher.py
          echo '' | base64 -d > scripts/html_renderer.py
          echo '' | base64 -d > scripts/migrate_images.py

      - name: Rebuild index.html from existing feed.xml
        run: |
          cd scripts
          python3 -c "
          import html_renderer
          html_renderer.rebuild_from_feed('https://feed.addwine.ru')
          print('OK')
          "

      - name: First push (test PAT)
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Update: design, categories, search, prompts"
            git push origin HEAD:main
          fi

      - name: Run image migration
        if: ${{ inputs.run_migration }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RECRAFT_API_KEY: ${{ secrets.RECRAFT_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/migrate_images.py

      - name: Second push (after migration)
        if: ${{ inputs.run_migration }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Migration: regenerate images with Recraft + categories"
            git push origin HEAD:main
          fi
