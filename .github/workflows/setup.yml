name: Bootstrap project files

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Configure git remote
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@local"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_WORKFLOWS }}@github.com/${{ github.repository }}.git"

      - name: Update project files
        run: |
          echo '' | base64 -d > scripts/feed_io.py
          echo '' | base64 -d > scripts/publisher.py
          echo '' | base64 -d > scripts/migrate_to_dzen.py
          echo '' | base64 -d > scripts/html_renderer.py
          echo '' | base64 -d > scripts/writer.py

      - name: Migrate feed.xml to Dzen format
        run: python scripts/migrate_to_dzen.py

      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Comply with Dzen RSS spec: content:encoded + CDATA + figure/img"
            git push origin HEAD:main
          fi
